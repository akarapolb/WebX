# WebX Studio — full stack for self-hosting / DGA on-prem.
#   docker compose up -d --build                     # db + strapi + webx
#   docker compose --profile wordpress up -d --build  # + WordPress engine (ORST/RoyalSociety-style tenants)
#   docker compose --profile ai up -d --build         # + the LiteLLM gateway
# Copy .env.production.example -> .env and fill the secrets first.
services:
  db:
    image: pgvector/pgvector:pg16          # Postgres 16 + pgvector (also serves RAG vectors)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 10

  strapi:
    build: ./strapi-cms
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Off by default — only set true if a reverse proxy you control sits
      # in front (see config/server.ts's own comment and
      # .env.production.example). Wires rate-limit.ts and traffic-log.ts's
      # IP resolution together (2026-09-12 audit fix).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      # Off by default to match this compose file's own `db` service (same
      # Docker network, not a public hop) — set DATABASE_SSL=true in .env for
      # any deployment where Strapi and the database aren't on the same
      # trusted private network (TOR Security: encryption in transit).
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      # AES-256-GCM key encrypting citizen PII at rest on contact-message/
      # registration (src/utils/pii-crypto.ts) — PDPA. Separate key from
      # ENCRYPTION_KEY (Strapi core's own) and WEBX_ENCRYPTION_KEY (webx's,
      # below) by design — different security domains.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?set PII_ENCRYPTION_KEY}
      # Demo MFA gate on Strapi's own native /admin UI (utils/mfa.ts) — TOTP
      # secret + HMAC cookie-signing secret. These were never wired through
      # to this container at all, so a value set in .env was silently
      # ignored and the code's own hardcoded fallbacks (a literal
      # well-known example TOTP secret) always applied in every deployment,
      # found in a full-codebase audit (2026-09-12). Left optional, not
      # `:?`-required like the secrets above — this gate is a documented
      # demo/soft protection (doesn't cover the real admin login API, only
      # direct browser navigation — see MFA_ENABLED below to turn it off
      # instead of relying on it). Set real values here if you want it to
      # mean anything in production; MFA_COOKIE_SECRET falls back to
      # ADMIN_JWT_SECRET when unset, which is a reasonable default once that
      # secret itself is real.
      MFA_ENABLED: ${MFA_ENABLED:-true}
      MFA_SECRET: ${MFA_SECRET:-}
      MFA_COOKIE_SECRET: ${MFA_COOKIE_SECRET:-}
      # Public-site's real production domain(s), comma-separated — needed so
      # its browser-side calls (e.g. the cookie-consent banner) pass CORS.
      # Leave unset for a Docker-Compose-only deploy where public-site is
      # served from the same host under a path Strapi already trusts.
      WEBX_PUBLIC_SITE_ORIGINS: ${WEBX_PUBLIC_SITE_ORIGINS:-}
      APP_KEYS: ${APP_KEYS:?set APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?set API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?set TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Seeds the release-scheduler's own login (src/seed/seed.ts's
      # seedScheduler) — must match what's set on `webx` and `release-scheduler`
      # below, since all three just reference the same .env value.
      STRAPI_SCHEDULER_PASSWORD: ${STRAPI_SCHEDULER_PASSWORD:?set STRAPI_SCHEDULER_PASSWORD}
      # Seeds the two bundled demo-tenant editor logins (seed.ts's
      # seedEditors — dga-editor@dga.local / pea-editor@pea.local). Found
      # unconditional with a hardcoded, public password and no override at
      # all in a full-codebase audit (2026-09-12) — same class of problem as
      # STRAPI_SCHEDULER_PASSWORD above, fixed the same way.
      DGA_EDITOR_PASSWORD: ${DGA_EDITOR_PASSWORD:?set DGA_EDITOR_PASSWORD}
      PEA_EDITOR_PASSWORD: ${PEA_EDITOR_PASSWORD:?set PEA_EDITOR_PASSWORD}
      # Shared secret for the /api/internal/* routes (tenant-of,
      # custom-role-permissions) — must match webx's own STRAPI_INTERNAL_SECRET
      # and wordpress's WEBX_INTERNAL_SECRET below (same .env value, three
      # env-var names on three services, intentional — see internal.ts's
      # own comment).
      WEBX_INTERNAL_SECRET: ${STRAPI_INTERNAL_SECRET:?set STRAPI_INTERNAL_SECRET}
    volumes:
      - strapi-uploads:/app/public/uploads
    ports:
      # `webx` is the actual product surface (its login proxies to Strapi
      # server-side, over the internal docker network — a browser never
      # needs to reach this port for the normal editor workflow). This port
      # only matters for Strapi's own native /admin UI (a fallback/service-
      # account surface) and direct API calls. Bound to loopback by default
      # so an operator can still reach it (SSH tunnel, or a shell on the
      # host) without it being open to the network by default — found
      # publicly reachable with no reverse-proxy/TLS step required in front
      # of it in a full-codebase audit (2026-09-12). Remove the
      # "127.0.0.1:" prefix if you have a real reason to expose it directly.
      - "127.0.0.1:${STRAPI_PORT:-1337}:1337"

  webx:
    build: ./webx-studio
    restart: unless-stopped
    depends_on:
      - strapi
    environment:
      NODE_ENV: production
      STRAPI_URL: http://strapi:1337
      # Shared secret for governance.ts's internal cross-tenant/custom-role
      # lookups (GET /api/internal/tenant-of, /custom-role-permissions) —
      # must match strapi's own WEBX_INTERNAL_SECRET above.
      STRAPI_INTERNAL_SECRET: ${STRAPI_INTERNAL_SECRET:?set STRAPI_INTERNAL_SECRET}
      # AI (optional): point at the litellm service or any OpenAI-compatible gateway
      LITELLM_URL: ${LITELLM_URL:-}
      LITELLM_KEY: ${LITELLM_KEY:-}
      # RAG vector store: leave WEBX_VECTOR empty for in-app cosine, or 'pgvector'
      WEBX_VECTOR: ${WEBX_VECTOR:-}
      PGVECTOR_URL: ${PGVECTOR_URL:-}
      # Release scheduler (see the release-scheduler service below): the
      # secret protects POST /api/internal/releases/process-due itself; the
      # STRAPI_SCHEDULER_* pair is the account this process logs in as to
      # actually publish (must match the strapi service's own
      # STRAPI_SCHEDULER_PASSWORD above — same seeded account, same secret).
      # WORDPRESS_SCHEDULER_* only matters if a release ever contains a
      # WordPress-backed item; leave blank if this deployment has no
      # WordPress engine tenant.
      WEBX_SCHEDULER_SECRET: ${WEBX_SCHEDULER_SECRET:?set WEBX_SCHEDULER_SECRET}
      STRAPI_SCHEDULER_EMAIL: scheduler@webx.local
      STRAPI_SCHEDULER_PASSWORD: ${STRAPI_SCHEDULER_PASSWORD:?set STRAPI_SCHEDULER_PASSWORD}
      WORDPRESS_SCHEDULER_USERNAME: ${WORDPRESS_SCHEDULER_USERNAME:-}
      WORDPRESS_SCHEDULER_APP_PASSWORD: ${WORDPRESS_SCHEDULER_APP_PASSWORD:-}
      # SSO (Keycloak) — encrypts each tenant's Keycloak client secret and
      # JIT-provisioned shadow Strapi passwords at rest. Only required if a
      # tenant enables SSO in its Single Sign-On settings page.
      WEBX_ENCRYPTION_KEY: ${WEBX_ENCRYPTION_KEY:-}
      # SSO deprovisioning sync (see sso-reconcile-scheduler below) — a
      # Keycloak MASTER-REALM admin credential, same one used to set up
      # realms/clients by hand (same values as the keycloak service's own
      # KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD below, reused not duplicated).
      # Only required if any tenant has SSO enabled.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # WebX Agent background jobs: this process runs a worker (see
      # webx-studio/.env.example). Jobs are leased in Strapi, so replicas are safe.
      AGENT_WORKER_ENABLED: ${AGENT_WORKER_ENABLED:-1}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-3}
      AGENT_SLICE_TURNS: ${AGENT_SLICE_TURNS:-8}
    # On stop, running job slices finish their current turn and go back to the
    # queue (the worker waits up to 20s); anything slower is reclaimed after
    # its lease expires.
    stop_grace_period: 30s
    ports:
      - "${WEBX_PORT:-3000}:3000"

  # Ticks POST /api/internal/releases/process-due on an interval so scheduled
  # Releases (Releases.tsx's "Schedule" button) actually fire — nothing else
  # in this stack calls that endpoint (deliberately not an in-process timer
  # inside `webx` itself: this repo may run multiple `webx` replicas behind a
  # load balancer, and an in-process interval would tick once per replica,
  # double-processing the same due release — see the route's own comment).
  release-scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - webx
    environment:
      WEBX_SCHEDULER_SECRET: ${WEBX_SCHEDULER_SECRET:?set WEBX_SCHEDULER_SECRET}
      INTERVAL_SECONDS: ${RELEASE_SCHEDULER_INTERVAL_SECONDS:-60}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf -X POST -H "X-Internal-Secret: $$WEBX_SCHEDULER_SECRET" http://webx:3000/api/internal/releases/process-due \
            || echo "[release-scheduler] tick failed"
          sleep "$$INTERVAL_SECONDS"
        done

  # Ticks POST /api/internal/agent/tick so WebX Agent schedules start their
  # jobs on time, and each webx worker is woken to claim queued jobs (expired
  # leases are reaped by the claim). Same not-an-in-process-timer reasoning as
  # release-scheduler above; ticks may overlap safely, since a schedule only
  # advances by compare-and-set in Strapi.
  agent-scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - webx
    environment:
      WEBX_SCHEDULER_SECRET: ${WEBX_SCHEDULER_SECRET:?set WEBX_SCHEDULER_SECRET}
      INTERVAL_SECONDS: ${AGENT_SCHEDULER_INTERVAL_SECONDS:-60}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf -X POST -H "X-Internal-Secret: $$WEBX_SCHEDULER_SECRET" http://webx:3000/api/internal/agent/tick \
            || echo "[agent-scheduler] tick failed"
          sleep "$$INTERVAL_SECONDS"
        done

  # Ticks POST /api/internal/sso/reconcile so removing someone from Keycloak
  # actually revokes (deactivates) their WebX access instead of leaving a
  # JIT-provisioned account active forever — see governance.ts's
  # reconcileSsoDeprovisioning. Same not-an-in-process-timer reasoning as
  # release-scheduler above. Longer default interval: deprovisioning doesn't
  # need release-scheduler's 60s promptness.
  sso-reconcile-scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - webx
    environment:
      WEBX_SCHEDULER_SECRET: ${WEBX_SCHEDULER_SECRET:?set WEBX_SCHEDULER_SECRET}
      INTERVAL_SECONDS: ${SSO_RECONCILE_INTERVAL_SECONDS:-900}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf -X POST -H "X-Internal-Secret: $$WEBX_SCHEDULER_SECRET" http://webx:3000/api/internal/sso/reconcile \
            || echo "[sso-reconcile-scheduler] tick failed"
          sleep "$$INTERVAL_SECONDS"
        done

  # Nightly Postgres + uploads-volume backup (DEPLOY.md's production
  # checklist item). Local-only for now — writes into the db-backups volume
  # on this same host, not off-site; wiring an S3-compatible upload target
  # is the natural next step once one is chosen. Runs strapi-cms's own
  # backup-db.js (see that file) rather than duplicating its rotation logic
  # here in shell.
  db-backup:
    build:
      context: ./strapi-cms
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      UPLOADS_SRC: /app/uploads-src
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - db-backups:/app/backups
      - strapi-uploads:/app/uploads-src:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          node scripts/backup-db.js || echo "[db-backup] backup failed"
          sleep "$$INTERVAL_SECONDS"
        done

  # WordPress engine — optional (profile "wordpress"): only needed for
  # tenants created with engine:"wordpress" (see webx-studio's
  # NewWorkspace.tsx). Mirrors docker-compose.wordpress.yml's dev setup —
  # same custom image (./wordpress/Dockerfile), same bootstrap script — with
  # production credentials/URL instead of localhost:8081 defaults, and
  # WITHOUT WP_ALLOW_HTTP_APP_PASSWORDS (this must be served over real HTTPS,
  # e.g. behind a reverse proxy that terminates TLS in front of it).
  wp-mysql:
    image: mysql:8
    restart: unless-stopped
    profiles: ["wordpress"]
    environment:
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:?set WORDPRESS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
    volumes:
      - wp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${WORDPRESS_DB_ROOT_PASSWORD:?set WORDPRESS_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  wordpress:
    build: ./wordpress
    restart: unless-stopped
    profiles: ["wordpress"]
    depends_on:
      wp-mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
      # Custom-role enforcement backstop (mu-plugins/custom-role-enforcement.php)
      # — outbound call to Strapi's internal API. Same Docker network as
      # strapi (both in this compose file, no explicit `networks:` block —
      # Compose's implicit default bridge already resolves service names).
      STRAPI_INTERNAL_URL: http://strapi:1337
      WEBX_INTERNAL_SECRET: ${STRAPI_INTERNAL_SECRET:?set STRAPI_INTERNAL_SECRET}
    volumes:
      - wp-content-data:/var/www/html
    ports:
      - "${WORDPRESS_PORT:-8081}:80"

  # Runs once against the wordpress service above (installs core, activates
  # ACF, sets pretty permalinks — see wordpress/bootstrap.sh), then idles so
  # `docker compose exec wp-cli wp ...` still works for ad-hoc admin
  # commands afterward. Safe to leave running; harmless if it never
  # restarts, since the bootstrap itself is idempotent.
  wp-cli:
    image: wordpress:cli
    restart: unless-stopped
    profiles: ["wordpress"]
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - wp-content-data:/var/www/html
      - ./wordpress/bootstrap.sh:/bootstrap.sh:ro
    environment:
      WP_SITE_URL: ${WORDPRESS_SITE_URL:?set WORDPRESS_SITE_URL — the real public URL this WordPress will be served at}
      WP_SITE_TITLE: ${WORDPRESS_SITE_TITLE:-WebX WordPress}
      WORDPRESS_SCHEDULER_USERNAME: ${WORDPRESS_SCHEDULER_USERNAME:?set WORDPRESS_SCHEDULER_USERNAME}
      WP_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:?set WORDPRESS_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:?set WORDPRESS_ADMIN_EMAIL}
    entrypoint: ["sh", "-c", "sh /bootstrap.sh; tail -f /dev/null"]

  # WordPress's own daily database + content backup — TOR gap audit finding:
  # the db-backup service above only ever covered Strapi's Postgres database
  # and uploads volume. For every tenant created with engine:"wordpress"
  # (which is what ORST/RoyalSociety actually are), their real content lives
  # entirely in wp-mysql + wp-content-data, and neither had any backup
  # coverage at all until this service. Same image, same script
  # (backup-db.js, now mysqldump-capable) as db-backup, just pointed at the
  # WordPress database/volume instead — see that service's own comment for
  # the "local disk only, off-site is still on you" caveat, which applies
  # here too. wp-content-data holds WordPress core files alongside real
  # uploads (it's the whole /var/www/html, not a dedicated uploads dir like
  # Strapi's) — backed up as one tarball for the same reason a full-site
  # backup is normally taken rather than trying to carve out just
  # wp-content/uploads from a bind-mounted core install.
  wp-db-backup:
    build:
      context: ./strapi-cms
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    profiles: ["wordpress"]
    depends_on:
      wp-mysql:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: wp-mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: wordpress
      DATABASE_USERNAME: wordpress
      DATABASE_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
      UPLOADS_SRC: /app/uploads-src
      UPLOAD_PREFIX: wp-content
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - wp-db-backups:/app/backups
      - wp-content-data:/app/uploads-src:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          node scripts/backup-db.js || echo "[wp-db-backup] backup failed"
          sleep "$$INTERVAL_SECONDS"
        done

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    profiles: ["ai"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      # Was ${LITELLM_MASTER_KEY:-} (silently blank-able) — LiteLLM treats an
      # unset/empty master key as "no auth required" on its own OpenAI-
      # compatible endpoints, so an operator who ran this profile without
      # setting it got a gateway holding real ANTHROPIC/OPENAI/GEMINI keys
      # reachable with zero auth on whatever LITELLM_PORT is bound to. Found
      # in a full-codebase audit (2026-09-12). Now hard-required, matching
      # every other secret in this file.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      # Pure backend gateway — nothing ever reaches it directly from a
      # browser (every AI feature calls it server-side, from `webx`, over
      # the internal docker network). Bound to loopback by default so it's
      # reachable for an operator's own debugging (an SSH tunnel, or a shell
      # on the host itself) without being open to the network by default;
      # remove the "127.0.0.1:" prefix to expose it directly if you have a
      # real reason to (found publicly reachable in a full-codebase audit,
      # 2026-09-12, combined with the master-key gap above).
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"

  # Keycloak — optional (profile "keycloak"): SSO/OIDC identity broker for
  # tenants with SSO configured (see webx-studio's SsoSettings.tsx /
  # lib/oidc.ts). v1 scope is manual realm/client setup via Keycloak's own
  # admin console — no automated realm provisioning. Independently runnable
  # since local dev doesn't otherwise touch Docker:
  #   docker compose --profile keycloak up -d keycloak
  # then set a tenant's Issuer URL (in the SSO settings page) to
  # http://localhost:${KEYCLOAK_PORT:-8082}/realms/<your-realm>.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    profiles: ["keycloak"]
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  db-data:
  strapi-uploads:
  db-backups:
  wp-db-data:
  wp-content-data:
  wp-db-backups:
  keycloak-data:
