name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  build-webx-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webx-studio/package-lock.json
      - working-directory: webx-studio
        run: npm ci
      - working-directory: webx-studio
        run: npx tsc --noEmit
      - working-directory: webx-studio
        run: npm test
      - working-directory: webx-studio
        run: npm run build

  build-strapi-cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - working-directory: strapi-cms
        run: npx tsc --noEmit
      - working-directory: strapi-cms
        run: npm run build

  typecheck-public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: public-site/package-lock.json
      - working-directory: public-site
        run: npm ci
      - working-directory: public-site
        run: npx tsc --noEmit

  # Both jobs below boot a real, freshly-seeded strapi-cms instance
  # (ephemeral sqlite DB, throwaway secrets — never a real deployment) rather
  # than mocking anything, since both eval/README.md and docs/TECHNICAL.md
  # call these "CI gates" while neither actually ran in CI at all — a
  # full-codebase audit (2026-09-12) found the claim was simply false. This
  # closes that gap for the two suites that are practical to run without
  # WordPress/Keycloak/a real LLM key (see the job comments below for what's
  # still deliberately manual-only, and why).
  #
  # `strapi develop` (not build+start) — proven live during the same audit
  # to reliably boot and fully seed from an empty DB, just slow the first
  # time (~8 minutes to seed everything cold); this job isn't on the fast
  # inner dev loop the other three jobs are, so that trade is fine here.
  eval-thai-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          # Must be valid base64 decoding to exactly 32 bytes (pii-crypto.ts
          # throws otherwise) — a fixed throwaway value, fine for an
          # ephemeral CI database nobody ever reads back.
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          MFA_ENABLED: "false" # no interactive login in this job; the demo MFA gate has nothing to protect here
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      - working-directory: eval
        env:
          STRAPI_URL: http://localhost:1337
        run: node thai-eval.mjs # keyword mode only — semantic mode needs a real LITELLM_URL/key, not wired into CI

  e2e-cross-tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          MFA_ENABLED: "false" # webx-studio's own login flow is what's under test, not this demo gate
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webx-studio/package-lock.json
      - working-directory: webx-studio
        run: npm ci
      - name: Boot webx-studio against the CI Strapi instance
        working-directory: webx-studio
        env:
          STRAPI_URL: http://localhost:1337
          # No STRAPI_INTERNAL_SECRET needed here — Strapi's MFA_ENABLED is
          # off for this job (see the boot step above), so admin-mfa.ts's
          # internal-secret exemption never comes into play either side.
        run: npm run dev > /tmp/webx-studio.log 2>&1 &
      - name: Wait for webx-studio to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then echo "webx-studio is up"; exit 0; fi
            sleep 5
          done
          echo "webx-studio did not become ready in time"; cat /tmp/webx-studio.log; exit 1
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        env:
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
        run: npx playwright test tests/cross-tenant-isolation.spec.ts

  # NOT wired into CI, deliberately — this is the honest half of the same
  # 2026-09-12 fix: the rest of e2e/'s suites (SSO/agent/wp-admin/user-
  # management) need a live WordPress + Keycloak + a real LLM key, which is
  # a much bigger, costlier multi-service stack to stand up per-PR than the
  # one job above. Run manually per e2e/README.md until that's worth the
  # investment — docs/TECHNICAL.md and eval/README.md have been corrected
  # to only call the job above (and the eval job) actual CI gates.
