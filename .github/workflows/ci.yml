name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  build-webx-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webx-studio/package-lock.json
      - working-directory: webx-studio
        run: npm ci
      - working-directory: webx-studio
        run: npx tsc --noEmit
      - working-directory: webx-studio
        run: npm test
      - working-directory: webx-studio
        run: npm run build

  # content-model/ is the source of the content types (docs/target-architecture.md, D5);
  # strapi-cms's schema files are generated copies and must not drift from it.
  content-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node content-model/sync.mjs check

  build-strapi-cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - working-directory: strapi-cms
        run: npx tsc --noEmit
      # The unit tests under strapi-cms/tests need no Strapi runtime (the audit skip's secret check, the scheduler password
      # rule, the form export, the assistant, search queries); nothing ran them before.
      - working-directory: strapi-cms
        run: npm test
      - working-directory: strapi-cms
        run: npm run build

  typecheck-public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: public-site/package-lock.json
      - working-directory: public-site
        run: npm ci
      - working-directory: public-site
        run: npx tsc --noEmit

  # Both jobs below boot a real, freshly-seeded strapi-cms instance
  # (ephemeral sqlite DB, throwaway secrets — never a real deployment) rather
  # than mocking anything, since both eval/README.md and docs/TECHNICAL.md
  # call these "CI gates" while neither actually ran in CI at all — a
  # full-codebase audit (2026-09-12) found the claim was simply false. This
  # closes that gap for the two suites that are practical to run without
  # WordPress/Keycloak/a real LLM key (see the job comments below for what's
  # still deliberately manual-only, and why).
  #
  # `strapi develop` (not build+start) — proven live during the same audit
  # to reliably boot and fully seed from an empty DB, just slow the first
  # time (~8 minutes to seed everything cold); this job isn't on the fast
  # inner dev loop the other three jobs are, so that trade is fine here.
  eval-thai-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          # Must be valid base64 decoding to exactly 32 bytes (pii-crypto.ts
          # throws otherwise) — a fixed throwaway value, fine for an
          # ephemeral CI database nobody ever reads back.
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          MFA_ENABLED: "false" # no interactive login in this job; the demo MFA gate has nothing to protect here
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      - working-directory: eval
        env:
          STRAPI_URL: http://localhost:1337
        run: node thai-eval.mjs # keyword mode only — semantic mode needs a real LITELLM_URL/key, not wired into CI

  e2e-cross-tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          MFA_ENABLED: "false" # webx-studio's own login flow is what's under test, not this demo gate
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webx-studio/package-lock.json
      - working-directory: webx-studio
        run: npm ci
      - name: Boot webx-studio against the CI Strapi instance
        working-directory: webx-studio
        env:
          STRAPI_URL: http://localhost:1337
          # Login looks up the editor's MFA enrollment with the seeded scheduler
          # service account and refuses the login if it can't (a fail-closed
          # fix, 2026-09-12): without these two the job's login got a 503. Same
          # account and password as Strapi's STRAPI_SCHEDULER_PASSWORD above.
          STRAPI_SCHEDULER_EMAIL: scheduler@webx.local
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          # No STRAPI_INTERNAL_SECRET needed here — Strapi's MFA_ENABLED is
          # off for this job (see the boot step above), so admin-mfa.ts's
          # internal-secret exemption never comes into play either side.
          WEBX_AUTH_RATE_MAX: "1000"
          WEBX_API_RATE_MAX: "6000"
        run: npm run dev > /tmp/webx-studio.log 2>&1 &
      - name: Wait for webx-studio to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then echo "webx-studio is up"; exit 0; fi
            sleep 5
          done
          echo "webx-studio did not become ready in time"; cat /tmp/webx-studio.log; exit 1
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        env:
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
        run: npx playwright test tests/cross-tenant-isolation.spec.ts
      # Track C1: the engine conformance suite (webx-studio/tests/conformance) against this job's Strapi, through the real
      # strapiAdapter, as two seeded editors of different tenants. It writes FAQ entries and an image and removes them after.
      # Runs even when the spec above failed, so both results are seen.
      - name: Engine conformance suite against Strapi
        if: ${{ !cancelled() }}
        working-directory: webx-studio
        env:
          CONFORMANCE_STRAPI_URL: http://localhost:1337
          CONFORMANCE_MAIN_EMAIL: dga-editor@dga.local
          CONFORMANCE_MAIN_PASSWORD: ci-dga-pw-${{ github.run_id }}
          CONFORMANCE_OTHER_EMAIL: pea-editor@pea.local
          CONFORMANCE_OTHER_PASSWORD: ci-pea-pw-${{ github.run_id }}
        run: node --import ./tests/setup/register.mjs --import tsx --test tests/conformance/strapi.conformance.test.ts

  # Track C3: with the audit log in webx-control, a real editor's governed changes
  # land there (scoped, append-only), and none reach Strapi's own audit table.
  e2e-audit-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - name: Build webx-control
        working-directory: webx-control
        run: cargo build --release --locked
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          MFA_ENABLED: "false"
          # the analytics dashboard reads the audit log and cookie counts from the control plane (src/utils/control-plane.ts)
          WEBX_CONTROL_URL: http://localhost:1400
          WEBX_CONTROL_SERVICE_TOKEN: ci-audit-service-token
          # Studio's cross-tenant write guard (trueOwnerOf) asks Strapi who owns an entry; without this a background job, the
          # release scheduler and every guarded write would run unchecked (matches STRAPI_INTERNAL_SECRET on Studio below)
          WEBX_INTERNAL_SECRET: ci-internal-secret
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Start webx-control with its service token
        working-directory: webx-control
        env:
          WEBX_CONTROL_SERVICE_TOKEN: ci-audit-service-token
          WEBX_CONTROL_ADMIN_TOKEN: ci-audit-admin-token
          WEBX_PII_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: ./target/release/webx-control --db /tmp/control.db --port 1400 > /tmp/control.log 2>&1 &
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webx-studio/package-lock.json
      - working-directory: webx-studio
        run: npm ci
      - name: Boot webx-studio with the audit log, records and job queue in the control plane
        working-directory: webx-studio
        env:
          STRAPI_URL: http://localhost:1337
          STRAPI_SCHEDULER_EMAIL: scheduler@webx.local
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          WEBX_CONTROL_URL: http://localhost:1400
          WEBX_CONTROL_SERVICE_TOKEN: ci-audit-service-token
          WEBX_CONTROL_QUEUE: "1"
          # the model the agent's jobs call: the mock the job spec starts on this port (webx-studio/tests/harness/mockLlmServer.ts)
          LITELLM_URL: http://localhost:4010
          LITELLM_KEY: ci-mock
          # every spec signs in from this one machine: Studio's per-address caps (10 sign-ins per 10 minutes) are for people
          WEBX_AUTH_RATE_MAX: "1000"
          WEBX_API_RATE_MAX: "6000"
          # the cross-tenant write guard: a background job and a scheduled release fail closed without it
          STRAPI_INTERNAL_SECRET: ci-internal-secret
          # the release scheduler's tick (POST /api/internal/releases/process-due), which the review/release spec calls
          WEBX_SCHEDULER_SECRET: ci-scheduler-secret
          # a publish must not start a build of the public site on this runner
          PUBLIC_SITE_AUTO_REBUILD: "off"
        run: npm run dev > /tmp/webx-studio.log 2>&1 &
      - name: Wait for webx-studio to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login > /dev/null; then echo "webx-studio is up"; exit 0; fi
            sleep 5
          done
          echo "webx-studio did not become ready in time"; cat /tmp/webx-studio.log; exit 1
      - working-directory: e2e
        run: npm ci
      - working-directory: e2e
        run: npx playwright install --with-deps chromium
      - working-directory: e2e
        env:
          AUDIT_CONTROL_URL: http://localhost:1400
          AUDIT_CONTROL_TOKEN: ci-audit-service-token
          AUDIT_CONTROL_ADMIN_TOKEN: ci-audit-admin-token
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          ANALYTICS_READS_CONTROL: "1"
          WEBX_SCHEDULER_SECRET: ci-scheduler-secret
        run: |
          status=0
          npx playwright test tests/audit-control-plane.spec.ts tests/records-control-plane.spec.ts tests/queue-control-plane.spec.ts tests/consent-control-plane.spec.ts tests/review-release-control-plane.spec.ts || status=1
          # the job spec turns background jobs on for dga and runs Studio's worker against a mock model: alone, so that the
          # jobs the queue spec puts in the queue are not leased by that worker while the queue spec reads them
          npx playwright test tests/agent-job-control-plane.spec.ts || status=1
          exit $status
      - if: failure()
        run: |
          # the access lines are most of the log: what the worker and the routes printed is what is wanted
          grep -vE '^ (GET|POST|PUT|DELETE|OPTIONS|HEAD) ' /tmp/webx-studio.log | tail -n 150
          tail -n 50 /tmp/control.log

  # Track C1: the engine conformance suite against WordPress (webx-studio/tests/conformance/wordpress.conformance.test.ts),
  # with the Strapi that WordPress asks which tenant an editor belongs to (mu-plugins/custom-role-enforcement.php).
  # WordPress is built from wordpress/ and installed by wordpress/bootstrap.sh, as docker-compose.wordpress.yml does for
  # development; wp-cli adds the two tenants' terms and an editor of each with an application password. Strapi's seed
  # already lists those editors as the two tenants' admins.
  conformance-wordpress:
    runs-on: ubuntu-latest
    env:
      WP_COMPOSE: docker compose -f docker-compose.wordpress.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build and start WordPress (MySQL, the WebX image, wp-cli running wordpress/bootstrap.sh)
        env:
          STRAPI_INTERNAL_SECRET: ci-internal-secret
          WP_DEV_ADMIN_PASSWORD: ci-wp-admin-pw-${{ github.run_id }}
        run: $WP_COMPOSE up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: strapi-cms/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          WEBX_INTERNAL_SECRET: ci-internal-secret
          MFA_ENABLED: "false"
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Wait for wp-cli's bootstrap, then add the tenants' terms and two editors with application passwords
        run: |
          for i in $(seq 1 60); do
            if $WP_COMPOSE logs wp-cli 2>/dev/null | grep -q '\[wp-bootstrap\] done'; then break; fi
            if [ "$i" = 60 ]; then echo "the bootstrap did not finish"; $WP_COMPOSE logs --tail 80; exit 1; fi
            sleep 5
          done
          wp() { $WP_COMPOSE exec -T -e WP_ALLOW_HTTP_APP_PASSWORDS=1 wp-cli wp --path=/var/www/html "$@"; }
          for t in orst royalsociety; do
            wp term create wtenant "$t" --slug="$t"
            wp user create "$t-editor" "$t-editor@$t.local" --role=editor --user_pass="ci-wp-$t-${{ github.run_id }}"
            pw=$(wp user application-password create "$t-editor" conformance --porcelain | tr -d '\r\n')
            echo "::add-mask::$pw"
            echo "WP_APP_PASSWORD_${t^^}=$pw" >> "$GITHUB_ENV"
          done
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webx-studio/package-lock.json
      - working-directory: webx-studio
        run: npm ci
      - name: Engine conformance suite against WordPress
        working-directory: webx-studio
        env:
          CONFORMANCE_WP_URL: http://localhost:8081/wp-json
          CONFORMANCE_WP_MAIN_USER: orst-editor
          CONFORMANCE_WP_MAIN_APP_PASSWORD: ${{ env.WP_APP_PASSWORD_ORST }}
          CONFORMANCE_WP_OTHER_USER: royalsociety-editor
          CONFORMANCE_WP_OTHER_APP_PASSWORD: ${{ env.WP_APP_PASSWORD_ROYALSOCIETY }}
        run: node --import ./tests/setup/register.mjs --import tsx --test tests/conformance/wordpress.conformance.test.ts
      - if: failure()
        run: |
          $WP_COMPOSE logs --tail 120 wordpress wp-cli
          tail -n 60 /tmp/strapi.log

  # NOT wired into CI, deliberately — this is the honest half of the same
  # 2026-09-12 fix: the rest of e2e/'s suites (SSO/agent/wp-admin/user-
  # management) need a live WordPress + Keycloak + a real LLM key, which is
  # a much bigger, costlier multi-service stack to stand up per-PR than the
  # one job above. Run manually per e2e/README.md until that's worth the
  # investment — docs/TECHNICAL.md and eval/README.md have been corrected
  # to only call the job above (and the eval job) actual CI gates.
