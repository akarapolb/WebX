name: Rust read engine

# The read-only Rust engine (rust-engine/, docs/rust-engine-plan.md) must give
# a public-site build exactly what Strapi gives it. This runs the plan's
# "test that decides done" against a freshly seeded Strapi: record a build's
# reads through Strapi, export the snapshot, replay the reads against the
# engine (contract test), build again against the engine and diff the two
# exports file by file (all tenants, then each Strapi tenant).
#
# Only on changes that can break that: the engine, the code public-site uses
# to read Strapi, and Strapi's content types and API settings.
on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "rust-engine/**"
      - "webx-control/**"
      - "webx-agent/**"
      - "content-model/**"
      - "webx-studio/lib/cms/rust.ts"
      - "webx-studio/tests/conformance/**"
      - "public-site/lib/cms.ts"
      - "public-site/lib/publicCms*"
      - "public-site/next.config.mjs"
      - "strapi-cms/src/api/**/content-types/**"
      - "strapi-cms/src/components/**"
      - "strapi-cms/config/api.ts"
      - ".github/workflows/rust-engine.yml"
  pull_request:
    paths:
      - "rust-engine/**"
      - "webx-control/**"
      - "webx-agent/**"
      - "content-model/**"
      - "public-site/lib/cms.ts"
      - "public-site/lib/publicCms*"
      - "public-site/next.config.mjs"
      - "strapi-cms/src/api/**/content-types/**"
      - "strapi-cms/src/components/**"
      - "strapi-cms/config/api.ts"
      - ".github/workflows/rust-engine.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
            webx-control/target
            webx-agent/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-engine/Cargo.lock', 'webx-control/Cargo.lock', 'webx-agent/Cargo.lock') }}
      - run: cargo test --locked
      - name: webx-control unit tests
        working-directory: webx-control
        run: cargo test --locked
      # C5: the agent worker on MicroAgent, against a mock model and a mock tool gateway
      - name: webx-agent job tests
        working-directory: webx-agent
        run: cargo test --locked

  build-identical:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-engine/Cargo.lock') }}
      - working-directory: rust-engine
        run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            strapi-cms/package-lock.json
            public-site/package-lock.json
            webx-studio/package-lock.json
      - working-directory: strapi-cms
        run: npm ci
      - working-directory: public-site
        run: npm ci
      - working-directory: webx-studio
        run: npm ci
      # Same throwaway setup as ci.yml's Strapi jobs: ephemeral sqlite DB and
      # secrets, seeded from empty (slow the first time, ~8 minutes).
      - name: Boot a freshly-seeded Strapi (ephemeral secrets, throwaway DB)
        working-directory: strapi-cms
        env:
          DATABASE_FILENAME: .tmp/ci.db
          APP_KEYS: ci-key-a,ci-key-b
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRAPI_SCHEDULER_PASSWORD: ci-scheduler-pw
          DGA_EDITOR_PASSWORD: ci-dga-pw-${{ github.run_id }}
          PEA_EDITOR_PASSWORD: ci-pea-pw-${{ github.run_id }}
          MFA_ENABLED: "false"
        run: npx strapi develop > /tmp/strapi.log 2>&1 &
      - name: Wait for Strapi to finish booting and seeding
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:1337/api/tenants/keys > /dev/null; then echo "Strapi is up"; exit 0; fi
            sleep 10
          done
          echo "Strapi did not become ready in time"; cat /tmp/strapi.log; exit 1
      # No WordPress here: the ORST and Royal Society pages build from their
      # fallbacks, the same way in both builds.
      # --no-check-export: the DGA hub's content is seeded by DGA-WebPublic,
      # not here, so in this fresh Strapi the hub routes render "not found"
      # pages and fall back to other tenants' rows, which check-export rejects.
      # check-export still runs in the hub's own builds; this job compares the
      # engine's build with Strapi's.
      - name: Build test (record, export, contract test, build, diff)
        working-directory: rust-engine
        run: node tools/build-test.mjs --strapi http://localhost:1337 --store db --no-check-export
      # R3: the write API, end to end on the binary (uses the snapshot the
      # build test just exported)
      # C2: webx-control answers the tenant routes exactly as Strapi does, and a
      # build that reads tenants from it is identical to one that does not
      - name: Build webx-control
        working-directory: webx-control
        run: cargo build --release --locked
      - name: Tenant registry parity with Strapi
        run: node webx-control/tools/parity-test.mjs --reference http://localhost:1337
      # C3: the audit log in the control plane, and Studio's adapter for it
      - name: Audit log in webx-control
        run: node webx-control/tools/audit-test.mjs
      # C4: users, memberships and signed tokens an engine can verify
      - name: Identity in webx-control
        run: node webx-control/tools/identity-test.mjs
      # C5: the job queue, and the worker with the real queue (mock model and Studio gateway)
      - name: Job queue in webx-control
        run: node webx-control/tools/jobs-test.mjs
      - name: Visitors' routes in webx-control
        run: node webx-control/tools/visitors-test.mjs
      - name: Form inboxes in webx-control
        run: node webx-control/tools/forms-test.mjs
      - name: Moving Strapi's form submissions into webx-control
        run: node webx-control/tools/migrate-forms-test.mjs
      - name: Build webx-agent
        working-directory: webx-agent
        run: cargo build --release --locked
      - name: Agent worker with the real job queue
        run: node webx-agent/tools/serve-test.mjs
      - name: Strapi users to webx-control users, mapping
        run: node --test webx-control/tools/users-map.test.mjs
      - name: Write API test
        working-directory: rust-engine
        run: node tools/write-test.mjs
      # R3: Studio's conformance suite through the Rust adapter (rust.ts)
      - name: Conformance suite against the Rust engine
        working-directory: rust-engine
        run: node tools/conformance.mjs
      - name: Build reading tenants from webx-control
        run: node webx-control/tools/build-test.mjs --no-check-export
      # R5: a tenant whose content is only ever written through the Rust engine's
      # write API, registered in webx-control, built into a site
      - name: First Rust tenant
        working-directory: rust-engine
        run: node tools/rust-tenant-test.mjs
      - if: failure()
        run: tail -n 200 /tmp/strapi.log
