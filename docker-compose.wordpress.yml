# Dev-only WordPress instance for the Phase 2 CmsAdapter proof of concept.
# Separate from the production docker-compose.yml (Strapi/Postgres stack).
#   docker compose -f docker-compose.wordpress.yml up -d
services:
  wp-mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wpsecret
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wpsecret
    volumes:
      - wp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pwpsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      wp-mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wpsecret
    volumes:
      - wp-content-data:/var/www/html
    ports:
      - "8081:80"

  wp-cli:
    image: wordpress:cli
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - wp-content-data:/var/www/html
    entrypoint: ["tail", "-f", "/dev/null"] # kept alive so we can `docker compose exec` wp-cli commands

volumes:
  wp-db-data:
  wp-content-data:
