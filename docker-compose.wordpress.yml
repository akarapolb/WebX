# Dev-only WordPress instance for the Phase 2 CmsAdapter proof of concept.
# Separate from the production docker-compose.yml (Strapi/Postgres stack).
#   docker compose -f docker-compose.wordpress.yml up -d --build
# First boot takes a minute or two: the wp-cli service waits for WordPress
# itself to come up, installs it, activates ACF, and sets pretty permalinks
# (see wordpress/bootstrap.sh) — `docker compose logs -f wp-cli` to watch it.
# The one thing it can't do for you: after that finishes, log into
# http://localhost:8081/wp-admin (WORDPRESS_SCHEDULER_USERNAME below) and
# create an Application Password (Users -> Profile -> Application Passwords)
# for webx-studio's own WORDPRESS_SCHEDULER_APP_PASSWORD — WordPress won't
# let that be set to a chosen value, only generated interactively.
services:
  wp-mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wpsecret
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wpsecret
    volumes:
      - wp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pwpsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build: ./wordpress
    restart: unless-stopped
    depends_on:
      wp-mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wpsecret
      # Dev-only: this instance is served over plain HTTP (localhost:8081),
      # which WordPress core normally refuses for Application Passwords —
      # see mu-plugins/auth-header-fix.php's own comment for why this is
      # opt-in and unset in production.
      WP_ALLOW_HTTP_APP_PASSWORDS: "1"
      # Custom-role enforcement backstop (mu-plugins/custom-role-enforcement.php).
      # This container is NOT on the same Compose project/network as
      # docker-compose.yml's strapi service (they're started via two separate
      # `docker compose up` invocations — see e2e/README.md) — and in this
      # repo's own local dev, strapi-cms usually runs natively via
      # `npm run develop` on the host, not in Docker at all. Either way,
      # host.docker.internal reaches the host's own port 1337, which works
      # reliably under Docker Desktop (this repo's dev platform).
      STRAPI_INTERNAL_URL: http://host.docker.internal:1337
      # Must match whatever strapi-cms/.env has as WEBX_INTERNAL_SECRET —
      # two separate local env files in dev, unlike docker-compose.yml's
      # single shared .env.
      WEBX_INTERNAL_SECRET: ${STRAPI_INTERNAL_SECRET:-dev-internal-secret}
      # mu-plugins/webx-blocks-sync.php's own outbound call, once a native
      # Gutenberg save has synced page.acf.blocks — triggers the same
      # debounced public-site rebuild governance.ts's doPublish() already
      # triggers for a Visual Builder publish (see
      # webx-studio/app/api/internal/rebuild/route.ts). Same
      # host.docker.internal reasoning as STRAPI_INTERNAL_URL above;
      # WEBX_STUDIO_PORT overrides the port alone since it's the one part
      # that varies between dev machines (webx-studio defaults to 3000, but
      # falls back to 3001+ whenever 3000 is already taken locally).
      WEBX_STUDIO_INTERNAL_URL: http://host.docker.internal:${WEBX_STUDIO_PORT:-3000}
      # Must match webx-studio/.env.local's own WEBX_SCHEDULER_SECRET — same
      # secret the external release-scheduler cron already authenticates
      # with against /api/internal/releases/process-due, reused here rather
      # than minting a second internal secret for one more internal caller.
      # (The fallback below is an obvious placeholder, same convention as
      # WEBX_INTERNAL_SECRET's "dev-internal-secret" above — set
      # WEBX_SCHEDULER_SECRET in your shell/.env to the real dev value from
      # webx-studio/.env.local for the sync hook's rebuild call to actually
      # authenticate.)
      WEBX_SCHEDULER_SECRET: ${WEBX_SCHEDULER_SECRET:-dev-scheduler-secret}
    volumes:
      - wp-content-data:/var/www/html
    ports:
      - "8081:80"

  wp-cli:
    image: wordpress:cli
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - wp-content-data:/var/www/html
      - ./wordpress/bootstrap.sh:/bootstrap.sh:ro
    environment:
      WP_SITE_URL: http://localhost:8081
      WP_SITE_TITLE: WebX WordPress (dev)
      WORDPRESS_SCHEDULER_USERNAME: wpadmin
      WP_ADMIN_PASSWORD: ${WP_DEV_ADMIN_PASSWORD:-ChangeMe!Dev2569}
      WP_ADMIN_EMAIL: admin@webx.local
      # Must match the `wordpress` service's own DB_* values above — wp-cli
      # reads wp-config.php too (same shared volume), and wp-config.php
      # resolves DB_HOST/NAME/USER/PASSWORD from THIS container's own env at
      # runtime (getenv_docker(), the official image's own pattern), not
      # from a value baked into the file. Without these, wp-cli silently
      # falls back to wp-config.php's placeholder defaults ("mysql" host,
      # "example username"/"example password") instead of erroring loudly,
      # which is why `wp db check`/`wp core install` inside bootstrap.sh (and
      # any ad-hoc `wp` command run against this service) failed with
      # "Error establishing a database connection" instead of ever
      # completing — this was never a transient timing issue.
      WORDPRESS_DB_HOST: wp-mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wpsecret
    # Runs the bootstrap once, then idles so `docker compose exec wp-cli wp
    # ...` still works for ad-hoc commands afterward — same as before this
    # existed, just no longer starting from a completely bare WordPress.
    entrypoint: ["sh", "-c", "sh /bootstrap.sh; tail -f /dev/null"]

volumes:
  wp-db-data:
  wp-content-data:
