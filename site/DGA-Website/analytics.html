<!DOCTYPE html>
<!--
  DGA Website — แดชบอร์ดสถิติเว็บไซต์ (หลังบ้าน) · TOR โมดูล "Web Analytics + Heatmap (GA + Clarity)"
  สรุปสถิติ first-party จากระบบจริง (ต่อ tenant) + ลิงก์ไป GA4/Clarity ภายนอก
  ป้องกันด้วยการล็อกอินบัญชี Strapi Admin (PDPA: ข้อมูลฟอร์มแสดงเป็นจำนวนรวมเท่านั้น)
  ใช้ Design System: /assets/design-system.css + /assets/analytics.css
-->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ดสถิติเว็บไซต์ | สพร. (DGA)</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function(){ try{
      var t = localStorage.getItem('dga-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      document.documentElement.setAttribute('data-theme', t);
      if (localStorage.getItem('dga-contrast')==='high') document.documentElement.setAttribute('data-contrast','high');
    }catch(e){} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="stylesheet" href="/assets/analytics.css">
</head>
<body>
  <a class="skip-link" href="#main">ข้ามไปยังเนื้อหาหลัก</a>

  <header class="site-header" style="border-bottom:1px solid var(--c-border)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;max-width:1200px;margin:0 auto">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--c-text);font-weight:600">
        <img class="logo" src="assets/image/logo.svg" alt="สพร. (DGA)" style="height:32px;width:auto" onerror="this.style.display='none'">
        <span>สพร. — หลังบ้าน</span>
      </a>
      <span class="a-top__meta">Web Analytics Dashboard</span>
    </div>
  </header>

  <main id="main">
    <div class="a-shell">
      <div id="a-root">
        <p class="a-empty" style="text-align:center;padding:48px">กำลังเริ่มต้น…</p>
      </div>
    </div>
  </main>

  <script src="/assets/analytics.js?v=3"></script>
</body>
</html>
