<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebX Agent — design prototype</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* WebX Studio dark tokens (webx-studio/app/globals.css) — the prototype
   commits to the Studio's default dark theme; the public-site canvas inside
   the Builder stays light because real public sites are light. */
:root{--bg:#0F1117;--bg2:#141821;--panel:#161A23;--panel2:#1B202B;--sunk:#0B0D12;--line:#242A38;--line2:#313848;--ink:#E6E9F0;--ink2:#B3B9C9;--mut:#7E869B;--accent:#7A96FF;--accent-soft:rgba(122,150,255,.16);--on-accent:#0F1117;--ok:#5FC08F;--warn:#E5B567;--bad:#F2877F;--sans:'IBM Plex Sans Thai',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--r:10px;--r-lg:14px;--t:.22s cubic-bezier(.2,.7,.2,1);--sb:#12151D;--sb-ink:#E1E5EE;--sb-ink2:#AEB6CB;--sb-mut:#7F889E;--sb-line:rgba(255,255,255,.07);--sb-on:rgba(122,150,255,.14);--site-bg:#F5F7FB;--site-ink:#141826;--site-ink2:#4A5166;--site-line:#E4E8F1;--site-accent:#2F54EB}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
html[lang=th] body{line-height:1.7}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:none;padding:0}
input,textarea{font:inherit;color:inherit}
svg{display:block;width:16px;height:16px;flex:none}
.ico{display:inline-flex}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1}
::selection{background:var(--accent);color:#0F1117}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* prototype bar */
.pb{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#07090E;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.pb b{color:var(--ink);font-weight:600}
.pb .tabs{display:flex;gap:4px;margin-left:8px}
.pb .tab{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;color:var(--ink2)}
.pb .tab.on{background:var(--sb-on);color:var(--ink)}
.pb .kn{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--mut)}
.pb .sp{flex:1}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);border-radius:999px;padding:3px 9px;color:var(--mut)}
.pill.warn{color:var(--warn);border-color:rgba(229,181,103,.4)}
.lang{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.lang button{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;color:var(--mut)}
.lang button.on{background:var(--panel);color:var(--ink)}

/* shell */
.shell{display:flex;height:calc(100% - 40px)}
.sb{width:232px;flex:none;background:var(--sb);border-right:1px solid var(--sb-line);display:flex;flex-direction:column;color:var(--sb-ink2)}
.sb-top{padding:8px 14px}
.ten{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer}
.ten:hover{background:var(--sb-on)}
.ten-dot{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-weight:700}
.ten b{font-size:12.5px;color:var(--sb-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ten svg{color:var(--sb-mut)}
.nav{flex:1;overflow:auto;padding:4px 10px}
.nav-h{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--sb-mut);padding:14px 8px 6px;font-weight:600}
.nav>div:first-child>.nav-h{padding-top:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--sb-ink2);font-size:13.5px;font-weight:500;position:relative;cursor:pointer;margin-bottom:1px}
.nav a:hover,.nav a.on{background:var(--sb-on);color:var(--sb-ink)}
.nav a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.nav a svg{width:17px;height:17px;opacity:.9}
.nav a .kn{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--sb-mut);border:1px solid var(--sb-line);border-radius:5px;padding:0 5px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{height:56px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--bg2)}
.searchbtn{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:13px}
.searchbtn .kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.tb-sp{flex:1}
.ic-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.ic-btn:hover{background:var(--panel2);color:var(--ink)}
.agent-tg{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:10px;border:1px solid var(--line2);color:var(--ink);font-weight:600;font-size:13px}
.agent-tg.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.agent-tg .kbd{font-family:var(--mono);font-size:10.5px;color:var(--mut);border:1px solid var(--line2);border-radius:5px;padding:0 5px}
.demo-pill{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ok);border:1px solid rgba(95,192,143,.4);background:rgba(95,192,143,.12);border-radius:999px;padding:4px 10px}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.body{flex:1;min-height:0;display:flex}
.page{flex:1;min-width:0;overflow:auto;padding:22px;position:relative}
.view{display:none}.view.on{display:block}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.vh h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.vh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid var(--line2);color:var(--ink);white-space:nowrap;transition:all var(--t)}
.btn:hover{border-color:var(--ink2)}
.btn-p{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--panel2);color:var(--ink2)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:rgba(95,192,143,.14);color:var(--ok)}
.badge.warn{background:rgba(229,181,103,.14);color:var(--warn)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* builder */
.vb-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.vb-sel{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:13px;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{width:34px;height:28px;border-radius:7px;color:var(--mut);display:grid;place-items:center}
.seg button.on{background:var(--panel);color:var(--ink)}
.stage{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;justify-content:center}
.site{width:100%;max-width:860px;background:var(--site-bg);color:var(--site-ink);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px -40px rgba(0,0,0,.8);font-size:14px;line-height:1.55;min-height:520px}
.site-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--site-line)}
.site-bar i{width:9px;height:9px;border-radius:50%;background:var(--site-line)}
.site-bar span{margin-left:8px;font-family:var(--mono);font-size:11px;color:#7C849A;background:var(--site-bg);border-radius:6px;padding:3px 10px;flex:1;max-width:320px}
.site-empty{height:460px;display:grid;place-items:center;text-align:center;color:#7C849A;padding:24px}
.site-empty .dash{border:1.5px dashed #D4DAE7;border-radius:14px;padding:40px 32px;max-width:420px}
.site-empty b{display:block;color:var(--site-ink);font-size:15px;margin-bottom:6px}
.blk{position:relative;opacity:0;transform:translateY(10px);animation:blk-in .5s var(--t) forwards}
@keyframes blk-in{to{opacity:1;transform:none}}
.blk .tag{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(47,84,235,.92);color:#fff;border-radius:5px;padding:2px 7px;display:flex;align-items:center;gap:5px;z-index:2}
.blk .tag svg{width:10px;height:10px}
.blk.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:inset 0 0 0 3px var(--site-accent)}100%{box-shadow:inset 0 0 0 0 transparent}}
.s-hero{background:linear-gradient(135deg,#1E3FC9,#2F54EB 60%,#4A6BFF);color:#fff;padding:44px 40px}
.s-hero .kick{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
.s-hero h2{margin:0 0 10px;font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.01em;max-width:20ch}
.s-hero p{margin:0 0 20px;opacity:.9;max-width:52ch}
.s-hero .cta{display:inline-block;background:#fff;color:#1E3FC9;font-weight:700;border-radius:9px;padding:10px 16px}
.s-feat{padding:32px 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.s-feat>div{background:#fff;border:1px solid var(--site-line);border-radius:12px;padding:16px}
.s-feat b{display:block;margin:8px 0 4px;font-size:14px}
.s-feat small{color:var(--site-ink2);font-size:12.5px}
.s-feat .ic{width:32px;height:32px;border-radius:8px;background:#EAEFFF;color:var(--site-accent);display:grid;place-items:center}
.s-steps{padding:8px 40px 32px}
.s-steps h3,.s-faq h3{margin:0 0 14px;font-size:18px}
.s-steps ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:s}
.s-steps li{background:#fff;border:1px solid var(--site-line);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--site-ink2)}
.s-steps li b{display:block;color:var(--site-ink);margin-bottom:4px}
.s-steps li::before{counter-increment:s;content:"0" counter(s);font-family:var(--mono);font-size:11px;color:var(--site-accent);display:block;margin-bottom:6px}
.s-faq{padding:8px 40px 32px}
.s-faq details{background:#fff;border:1px solid var(--site-line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.s-faq summary{font-weight:600;cursor:pointer}
.s-faq p{margin:8px 0 0;color:var(--site-ink2)}
.s-cta{margin:0 40px 40px;background:#141826;color:#fff;border-radius:14px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.s-cta b{font-size:17px}
.s-cta span{display:inline-block;background:var(--site-accent);color:#fff;font-weight:600;border-radius:9px;padding:9px 14px;font-size:13px}
.s-note{margin:-16px 40px 32px;background:#EAEFFF;border:1px solid #D4DAE7;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#1E3FC9;display:flex;gap:9px;align-items:flex-start}
.s-note svg{width:14px;height:14px;margin-top:3px}

/* content editor */
.ed{max-width:780px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.fld{margin-bottom:14px;position:relative}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld input,.fld textarea{width:100%;background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13.5px;color:var(--ink);resize:vertical;transition:border-color var(--t),box-shadow var(--t)}
.fld textarea{min-height:110px;line-height:1.7}
.fld.live input,.fld.live textarea{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld .chg{display:none;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--ink2)}
.fld.changed .chg{display:flex}
.fld .chg b{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:5px}
.fld .chg b svg{width:12px;height:12px}
.fld .chg button{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;color:var(--ink)}
.fld .chg button.ok{color:var(--ok);border-color:rgba(95,192,143,.4)}
.fld .cnt{position:absolute;right:0;top:0;font-family:var(--mono);font-size:11px;color:var(--mut)}
.ed-foot{display:flex;gap:9px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--mut)}
.ed-foot .sp{flex:1}

/* reviews */
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-height:360px}
.col h3{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.col h3 .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--panel2);border-radius:999px;padding:1px 7px}
.col h3 i{width:8px;height:8px;border-radius:50%;flex:none}
.rc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;font-size:13px}
.rc.new{animation:blk-in .5s var(--t);border-color:var(--accent)}
.rc b{display:block;margin-bottom:4px}
.rc .m{font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.rc .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* agent panel */
.ag{width:400px;flex:none;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;transition:width var(--t),opacity var(--t);position:relative}
.ag.closed{width:0;overflow:hidden;opacity:0;border:none}
.ag-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ag-h .spark{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ag-h b{font-size:13.5px}
.ag-h small{display:block;font-size:11.5px;color:var(--mut)}
.ag-h .sp{flex:1}
.ag-h .ic-btn{width:30px;height:30px}
.ag-body{flex:1;min-height:0;overflow:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;font-size:13.5px;line-height:1.6}
.msg .av{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;margin-top:2px}
.msg .av svg{width:13px;height:13px}
.msg .tx{flex:1;min-width:0;color:var(--ink);white-space:pre-wrap}
.msg .tx b{font-weight:600}
.msg.user{justify-content:flex-end}
.msg.user .tx{flex:none;max-width:86%;background:var(--panel2);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:9px 13px}
.cur::after{content:"";display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tools{margin-left:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.tools .th{display:flex;align-items:center;gap:8px;padding:7px 11px;font-size:11.5px;color:var(--mut);border-bottom:1px solid var(--line);font-family:var(--mono)}
.tools .th .spin{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tools .th.done .spin{display:none}
.tools ul{list-style:none;margin:0;padding:6px 0}
.tools li{display:flex;align-items:center;gap:9px;padding:5px 11px;font-size:12px;color:var(--ink2);font-family:var(--mono);opacity:0;animation:blk-in .35s forwards}
.tools li .st{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none;position:relative}
.tools li.ok .st{border:none;background:var(--ok);animation:none}
.tools li.ok .st::after{content:"";position:absolute;left:4.5px;top:2px;width:3px;height:6px;border:solid #0F1117;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tools li .n{margin-left:auto;color:var(--mut)}
.card{margin-left:34px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);overflow:hidden;animation:blk-in .4s var(--t)}
.card .ch{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.card .ch .badge{margin-left:auto}
.card ul{list-style:none;margin:0;padding:6px 0}
.card li{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;font-size:12.5px;color:var(--ink2)}
.card li .k{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;flex:none;margin-top:1px}
.card li b{color:var(--ink);font-weight:600}
.card .cf{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg2)}
.card .cf .btn{height:32px}
.diff{margin-left:34px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;animation:blk-in .4s var(--t);flex-wrap:wrap}
.diff .k{color:var(--accent)}
.diff .a{color:var(--bad);text-decoration:line-through;opacity:.7}
.diff .b{color:var(--ok)}
.diff button{margin-left:auto;font-family:var(--sans);font-size:11.5px;font-weight:600;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-left:34px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);background:var(--panel);transition:all var(--t);text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.audit{margin-left:34px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);overflow:hidden;animation:blk-in .4s var(--t)}
.audit>div{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.audit>div:last-child{border:none}
.audit .ok{color:var(--ok)}.audit .warn{color:var(--warn)}
.audit button{margin-left:auto;font-size:11.5px;font-weight:600;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:var(--ink);white-space:nowrap}
.ag-ctx{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.ctx{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.ctx svg{width:11px;height:11px}
.comp{margin:0 14px 10px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px 10px 8px;transition:border-color var(--t),box-shadow var(--t)}
.comp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.comp textarea{width:100%;border:none;background:none;resize:none;outline:none;font-size:13.5px;line-height:1.55;min-height:44px;max-height:140px;padding:2px 4px;display:block}
.comp .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.comp .row .sp{flex:1}
.comp .mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mut);font-weight:600}
.comp .mini:hover{background:var(--panel2);color:var(--ink)}
.comp .model{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.comp .model svg{width:12px;height:12px;color:var(--accent)}
.comp .send{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.comp .send:disabled{opacity:.35;cursor:default}
.ag-hint{padding:0 14px 12px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between;font-family:var(--mono)}
.pop{position:absolute;top:52px;right:12px;width:330px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);z-index:20;display:none;overflow:hidden}
.pop.on{display:block}
.pop h4{margin:0;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
.pop ul{list-style:none;margin:0;padding:6px 0}
.pop li{display:flex;align-items:center;gap:9px;padding:5px 12px;font-size:12.5px;font-family:var(--mono)}
.pop li .st{width:12px;height:12px;border-radius:50%;flex:none}
.pop li.ok .st{background:var(--ok)}.pop li.no .st{background:var(--bad)}
.pop li.no{color:var(--mut);text-decoration:line-through}
.pop .ft{padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2);font-family:var(--sans)}
.fab{position:fixed;right:22px;bottom:22px;display:none;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px;padding:11px 16px;box-shadow:0 18px 40px -14px rgba(122,150,255,.7);z-index:30}
.fab.on{display:flex}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:9px;opacity:0;transition:all .3s;z-index:60;box-shadow:0 20px 50px -20px rgba(0,0,0,.8);pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--ok)}
@media (max-width:1100px){.sb{display:none}.ag{width:360px}.kan{grid-template-columns:1fr 1fr}.s-feat,.s-steps ol{grid-template-columns:1fr}}

  if(k==='hero') return `<div class="blk s-hero" id="blk-hero" ${d}>${tag()}<div class="kick">${L(BLOCKS.hero.kick)}</div><h2 id="heroH">${L(S.heroShort?BLOCKS.hero.hShort:BLOCKS.hero.h)}</h2><p>${L(BLOCKS.hero.p)}</p><span class="cta">${L(BLOCKS.hero.cta)}</span></div>`;

async function applyBlocks(){

/* ---------- content editor ---------- */
const FIELDS=['title','kicker','th','en','alt'];
// Thai has no spaces between words — use the browser's word segmenter when
// it has one, so the Thai field's count is real rather than "14 words".
const SEG=typeof Intl!=='undefined'&&Intl.Segmenter?new Intl.Segmenter('th',{granularity:'word'}):null;
function wc(s){s=(s||'').trim();if(!s)return 0;if(SEG&&/[฀-๿]/.test(s)){let n=0;for(const x of SEG.segment(s))if(x.isWordLike)n++;return n;}return s.split(/\s+/).filter(Boolean).length;}
function renderEditor(){
  $('cStatus').textContent=I('bDraft');
  FIELDS.forEach(f=>{const el=$('in-'+f);const v=S.fields[f];if(v===undefined){el.value=(f==='title'||f==='kicker')?L(ENTRY[f]):'';}else el.value=v;});
  $('cnt-th').textContent=(S.fields.th?wc(S.fields.th):0)+' '+I('words');
  $('cnt-en').textContent=(S.fields.en?wc(S.fields.en):0)+' '+I('words');
}
async function typeInto(f,text,speed){
  const el=$('in-'+f),fld=$('f-'+f);fld.classList.add('live');fld.classList.remove('changed');
  S.fields[f+'_prev']=el.value;el.value='';
  for(let i=0;i<=text.length;i+=Math.max(1,Math.round(text.length/90))){el.value=text.slice(0,i);el.scrollTop=el.scrollHeight;if(f==='th')$('cnt-th').textContent=wc(el.value)+' '+I('words');if(f==='en')$('cnt-en').textContent=wc(el.value)+' '+I('words');await sleep(speed);}
  el.value=text;S.fields[f]=text;fld.classList.remove('live');fld.classList.add('changed');
  if(f==='th')$('cnt-th').textContent=wc(text)+' '+I('words');if(f==='en')$('cnt-en').textContent=wc(text)+' '+I('words');
}
function acceptField(f){$('f-'+f).classList.remove('changed');toast(I('tAccepted'));}
function undoField(f){const el=$('in-'+f);el.value=S.fields[f+'_prev']||'';S.fields[f]=el.value||undefined;$('f-'+f).classList.remove('changed');if(f==='th'||f==='en')$('cnt-'+f).textContent=wc(el.value)+' '+I('words');toast(I('tUndo'));}

/* ---------- reviews ---------- */

function rcBtn(l,fn,p){return `<button class="btn btn-sm${p?' btn-p':''}" onclick="${fn}">${l}</button>`;}

/* ---------- agent panel: primitives ---------- */
const body=()=>$('agBody');
function scrollBottom(){const b=body();b.scrollTop=b.scrollHeight;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function addUser(t){const m=document.createElement('div');m.className='msg user';m.innerHTML=`<div class="tx">${esc(t)}</div>`;body().appendChild(m);scrollBottom();}
async function addAssistant(html,stream){
  const m=document.createElement('div');m.className='msg';m.innerHTML=`<div class="av">${ico('spark')}</div><div class="tx"></div>`;body().appendChild(m);
  const tx=m.querySelector('.tx');
  if(!stream){tx.innerHTML=html;scrollBottom();return m;}
  // stream plain text, then swap in the formatted version (keeps <b> markup)
  const plain=html.replace(/<[^>]+>/g,'');tx.classList.add('cur');
  const step=Math.max(1,Math.round(plain.length/110));
  for(let i=0;i<=plain.length;i+=step){tx.textContent=plain.slice(0,i);scrollBottom();await sleep(16);}
  tx.classList.remove('cur');tx.innerHTML=html;scrollBottom();return m;
}
async function addTools(steps){
  const w=document.createElement('div');w.className='tools';
  w.innerHTML=`<div class="th"><span class="spin"></span><span class="lbl"></span></div><ul></ul>`;body().appendChild(w);
  const ul=w.querySelector('ul'),lbl=w.querySelector('.lbl');
  for(let i=0;i<steps.length;i++){
    lbl.textContent=(S.lang==='th'?'กำลังทำงาน':'Working')+' · '+(i+1)+'/'+steps.length;
    const li=document.createElement('li');li.innerHTML=`<span class="st"></span><span>${steps[i]}</span>`;ul.appendChild(li);scrollBottom();
    await sleep(520+Math.random()*260);li.classList.add('ok');
  }
  w.querySelector('.th').classList.add('done');lbl.textContent=(S.lang==='th'?'เสร็จ':'Done')+' · '+steps.length+' '+(S.lang==='th'?'ขั้นตอน':'steps');
  return w;
}
function cardLi(b){return `<li><span class="k">${b.k}</span><span><b>${b.b}</b> — ${b.d}</span></li>`;}
function addCard(c){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class="ch">${ico('page')}${c.cardT}<span class="badge warn">${I('bDraft')}</span></div><ul>${c.blocks.map(cardLi).join('')}</ul><div class="cf"><button class="btn btn-p" id="applyBtn" onclick="runApply()">${ico('check')}${c.apply}</button><button class="btn" onclick="toast(I('tEdit'))">${c.edit}</button></div>`;
  body().appendChild(d);scrollBottom();return d;
}
function addDiff(k,a,b,undo){
  const d=document.createElement('div');d.className='diff';
  d.innerHTML=`<span class="k">${k}</span><span class="a">${esc(a)}</span>→<span class="b">${esc(b)}</span><button onclick="${undo}">${I('undo')}</button>`;
  body().appendChild(d);scrollBottom();
}
function chipBtn(c,i){return `<button class="chip" onclick="chip(${i})">${esc(c)}</button>`;}
function addChips(list){
  const d=document.createElement('div');d.className='chips';d.dataset.list=JSON.stringify(list);d.innerHTML=list.map(chipBtn).join('');body().appendChild(d);scrollBottom();S.chips=list;
}
function disableChips(){document.querySelectorAll('.chips .chip').forEach(b=>b.disabled=true);}
function auditRow(a,i){return `<div class="${a.ok?'ok':'warn'}">${ico(a.ok?'check':'warn')}<span style="color:var(--ink)">${a.t}</span>${a.ok?'':`<button onclick="runFix()">${a.fix}</button>`}</div>`;}
function addAudit(items){const d=document.createElement('div');d.className='audit';d.innerHTML=items.map(auditRow).join('');body().appendChild(d);scrollBottom();return d;}

function renderCtx(){
  const k=S.view==='builder'?'ctxPage':S.view==='content'?'ctxEntry':'ctxBoard';
  $('agCtx').innerHTML=`<span class="ctx">${ico('globe')}${I('ctxWs')}</span><span class="ctx">${ico(S.view==='builder'?'layout':S.view==='content'?'doc':'review')}${I(k)}</span><span class="ctx">${S.lang==='th'?'TH':'EN'} · TH+EN</span>`;
}
function resetChat(silent){
  // a new chat restarts the scripted conversation; canvas, entry fields and
  // the review board are real state and stay as they are
  body().innerHTML='';S.busy=false;S.stage=undefined;S.entryFilled=false;S.chips=[];
  addAssistant(C().welcome,false);addChips(C().chips);renderCtx();
  if(!silent)toast(I('tReset'));
}
function toggleAgent(){S.agent=!S.agent;$('ag').classList.toggle('closed',!S.agent);$('agentTg').classList.toggle('on',S.agent);$('fab').classList.toggle('on',!S.agent);$('pop').classList.remove('on');}
function togglePop(){$('pop').classList.toggle('on');}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(140,el.scrollHeight)+'px';}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

/* ---------- composer / dispatch ---------- */
async function chip(i){
  if(S.busy)return;const list=S.chips||[];const text=list[i];if(!text)return;
  disableChips();addUser(text);
  await route(text,i);
}
async function send(){
  const el=$('agIn');const t=el.value.trim();if(!t||S.busy)return;
  el.value='';autoGrow(el);disableChips();addUser(t);
  // free text: match the primary chip loosely, otherwise steer back
  const first=(S.chips||[])[0]||'';
  const hit=/landing|หน้า|page|write|เขียน|intro|บทนำ|summar|สรุป/i.test(t);
  await route(hit?first:t,hit?0:-1);
}
async function route(text,i){
  S.busy=true;
  try{
    if(S.view==='builder') await routeBuilder(text,i);
    else if(S.view==='content') await routeContent(text,i);
    else await routeReviews(text,i);
  } finally { S.busy=false; }
}

/* ---------- set piece A: build a page ---------- */
async function routeBuilder(text,i){
  const c=C();
  // follow-up chips are dispatched by their text, not their position —
  // the list shrinks as actions are used up, so positions shift
  if(S.stage==='after'){
    i=c.chips2.indexOf(text);
    if(i===0){await addTools(c.pdpaTools);S.pdpa=true;if(!S.blocks.includes('note')){S.blocks.splice(3,0,'note');}renderCanvas();await sleep(200);flash('blk-note');await addAssistant(c.pdpa,true);addChips(c.chips2.filter((_,j)=>j!==0));S.stage='after';return;}
    if(i===1){S.heroShort=true;renderCanvas();flash('blk-hero');addDiff('hero.heading',L(BLOCKS.hero.h),L(BLOCKS.hero.hShort),'undoHero()');await addAssistant(c.shorter,true);addChips(c.chips2.filter((_,j)=>j!==1));S.stage='after';return;}
    if(i===2){await addTools(c.subTools);S.submitted=true;REVIEWS.unshift({id:'REV-2041',t:{en:'e-Tax filing — landing page',th:'ยื่นภาษี e-Tax — หน้า landing'},type:'page',by:'dga-editor',col:'review',agent:true,new:true});renderCanvas();renderReviews();toast(I('tSubmitted'));await addAssistant(c.submitted,true);addChips(c.chips3);S.stage='submitted';return;}
  }
  if(S.stage==='submitted'){
    i=c.chips3.indexOf(text);
    if(i===0){S.busy=false;switchView('reviews');return;}
    if(i===1){await addAssistant(c.note,true);addChips([c.chips3[0]]);return;}
  }
  if(i===0&&!S.stage){
    await addTools(c.tools);await addAssistant(c.a,true);addCard(c);S.stage='proposed';return;
  }
  await addAssistant(c.canned,true);addChips(c.chips);
}
async function runApply(){
  if(S.busy||S.stage!=='proposed'||S.view!=='builder')return;S.busy=true;const c=C();
  const b=$('applyBtn');if(b){b.disabled=true;b.textContent=S.lang==='th'?'กำลังนำไปใช้…':'Applying…';}
  try{await applyBlocks();if(b){b.textContent=S.lang==='th'?'นำไปใช้แล้ว':'Applied';}await addAssistant(c.after,true);addChips(c.chips2);S.stage='after';}
  finally{S.busy=false;}
}
function undoHero(){S.heroShort=false;renderCanvas();flash('blk-hero');toast(I('tUndo'));}

/* ---------- set piece B: develop content ---------- */
async function routeContent(text,i){
  const c=C();
  // dispatch by chip text: "sharper title" sits at a different position in
  // the initial and follow-up lists
  const isWrite=text===c.chips[0], isTitle=text===c.chips[1]||text===c.chips2[0];
  if(isWrite&&!S.entryFilled){
    await addTools(c.tools.slice(0,2));await addAssistant(c.a1,true);
    await typeInto('th',ENTRY.th,22);await sleep(300);
    await addTools([c.tools[2]]);await typeInto('en',ENTRY.en,14);await sleep(300);
    await addTools([c.tools[3]]);await addAssistant(c.a2,false);addAudit(c.audit);S.entryFilled=true;return;
  }
  if(isTitle||(isWrite&&S.entryFilled)){
    const newT=S.lang==='th'?'ยื่นภาษีจากบ้านใน 10 นาที — e-Tax เติมข้อมูลให้แล้ว':'File your taxes from home in 10 minutes — e-Tax has it pre-filled';
    const prev=$('in-title').value;await typeInto('title',newT,18);addDiff('title',prev,newT,"undoField('title')");await addAssistant(c.title,true);addChips(c.chips2.slice(1));return;
  }
  await addAssistant(c.canned,true);addChips(c.chips);
}
async function runFix(){
  if(S.busy)return;S.busy=true;const c=C();
  try{document.querySelectorAll('.audit .warn button').forEach(b=>b.remove());await typeInto('alt',L(ENTRY.alt),16);
    const rows=document.querySelectorAll('.audit .warn');rows.forEach(r=>{r.className='ok';r.querySelector('svg').outerHTML=ico('check');});
    await addAssistant(c.fixed,true);addChips(c.chips2);}
  finally{S.busy=false;}
}

/* ---------- set piece C: reviews ---------- */
async function routeReviews(text,i){
  const c=C();
  i=c.chips.indexOf(text);
  if(i===0){await addTools([S.lang==='th'?'อ่านการเปลี่ยนแปลงใน REV-2041 · 5 บล็อก 2 การแก้ไข':'Reading REV-2041 changes · 5 blocks, 2 edits']);await addAssistant(c.sum,true);addChips([c.chips[1]]);return;}
  if(i===1){await addAssistant(c.waiting,true);addChips([c.chips[0]]);return;}
  await addAssistant(c.canned,true);addChips(c.chips);
}

/* ---------- keyboard + init ---------- */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='j'){e.preventDefault();toggleAgent();return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='Escape'){$('pop').classList.remove('on');return;}
  const order=['builder','content','reviews'];const i=+e.key-1;if(order[i])switchView(order[i]);
});
document.querySelectorAll('[data-ico]').forEach(el=>{el.innerHTML=ico(el.dataset.ico);});
applyI18n();renderNav();renderCanvas();renderEditor();renderReviews();resetChat(true);
</script>
