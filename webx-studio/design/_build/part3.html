}

let cmdkFiltered=[];
function openCmdk(){ $('cmdkIn').value=''; S.cmdkSel=0; $('scrim').classList.add('on'); $('cmdk').classList.add('on'); renderCmdk(); setTimeout(()=>$('cmdkIn').focus(),60); }
function closeCmdk(){ $('cmdk').classList.remove('on'); if(!$('drawer').classList.contains('on'))$('scrim').classList.remove('on'); }
function renderCmdk(){
  const q=($('cmdkIn').value||'').toLowerCase();
  cmdkFiltered=cmdkItems().filter(it=>it.label.toLowerCase().includes(q));
  if(S.cmdkSel>=cmdkFiltered.length) S.cmdkSel=0;
  const nav=cmdkFiltered.filter(i=>i.g==='nav'), act=cmdkFiltered.filter(i=>i.g==='act');
  let h=''; let idx=0;
  function sect(title,arr){ if(!arr.length)return; h+='<div class="cmdk-g">'+title+'</div>'; arr.forEach(it=>{ const gi=cmdkFiltered.indexOf(it);
    h+='<div class="cmdk-it'+(gi===S.cmdkSel?' sel':'')+'" onclick="cmdkRun('+gi+')">'+ic(it.icon)+'<span class="ci-l">'+it.label+'</span>'+(it.hint?'<span class="ci-h">'+it.hint+'</span>':'')+'</div>'; }); }
  sect(L(I18N.cmdkNav),nav); sect(L(I18N.cmdkAct),act);
  $('cmdkList').innerHTML=h||'<div class="cmdk-g">—</div>';
}
function cmdkRun(i){ const it=cmdkFiltered[i]; if(it){ it.act(); closeCmdk(); } }
function cmdkKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();S.cmdkSel=Math.min(S.cmdkSel+1,cmdkFiltered.length-1);renderCmdk();}
  else if(e.key==='ArrowUp'){e.preventDefault();S.cmdkSel=Math.max(S.cmdkSel-1,0);renderCmdk();}
  else if(e.key==='Enter'){e.preventDefault();cmdkRun(S.cmdkSel);}
}

  {ai:0,x:{en:'Backup snapshot stored (DR)',th:'บันทึกสำรอง (DR) แล้ว'}}
];
function fmtT(s){ s=s%86400; const h=Math.floor(s/3600),m=Math.floor(s%3600/60); return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
function pushFeed(item){
  const f=$('feed'); if(!f)return;
  const div=document.createElement('div'); div.className='fitem'+(item.ai?' ai':'');
  div.innerHTML='<span class="ft mono">'+fmtT(feedSec)+'</span><span class="fx">'+L(item.x)+'</span>';
  f.insertBefore(div,f.firstChild); while(f.children.length>7) f.removeChild(f.lastChild);
}
function seedFeed(){ $('feed').innerHTML=''; for(let i=4;i>=0;i--){ feedSec+= (5+i)*60; pushFeed(FEED_POOL[i]); } }
let feedI=0;
setInterval(()=>{ if(S.view!=='dashboard'||$('splash')&&!$('splash').classList.contains('gone'))return;
  feedSec+=Math.floor(Math.random()*180)+60; feedI=(feedI+1)%FEED_POOL.length; pushFeed(FEED_POOL[feedI]); }, 4200);

/* ============ GLOBAL KEYS ============ */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); return; }
  if(e.key==='Escape'){ closeOverlays(); return; }
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
  const i=+e.key-1; if(VIEW_ORDER[i]) switchView(VIEW_ORDER[i]);
});
document.addEventListener('click',e=>{ if(!e.target.closest('.ten')) $('tenPop').classList.remove('on'); });

/* ============ INIT ============ */
applyAccent(T.aurora.accent,T.aurora.accent2);
applyI18n(); renderAll(); seedFeed();
</script>
