[package]
name = "webx-read-engine"
version = "0.1.0"
edition = "2021"
description = "Read-only WebX content engine for public-site builds (serves a Strapi snapshot)"
license = "MIT"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# preserve_order: answers keep Strapi's own key order, so builds come out byte-identical
serde_json = { version = "1", features = ["preserve_order"] }
tower-http = { version = "0.5", features = ["fs"] }

[profile.release]
opt-level = 3
strip = true
