[package]
name = "webx-read-engine"
version = "0.1.0"
edition = "2021"
description = "Read-only WebX content engine for public-site builds (serves a Strapi snapshot)"
license = "MIT"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# preserve_order: answers keep Strapi's own key order, so builds come out byte-identical
serde_json = { version = "1", features = ["preserve_order"] }
tower-http = { version = "0.5", features = ["fs"] }
# the engine's own durable store (docs/target-architecture.md, track R2); bundled = no system SQLite needed
rusqlite = { version = "0.32", features = ["bundled"] }
# R3 write API: random ids and tokens, token hashes
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = 3
strip = true
